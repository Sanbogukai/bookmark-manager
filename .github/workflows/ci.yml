# Runs the server's type check and tests on every push and pull request, against a real
# PostgreSQL 18, so a broken test shows as a red cross on GitHub instead of being found later.
name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    # Every command below runs inside server/.
    defaults:
      run:
        working-directory: server
    # A throwaway PostgreSQL 18 for the tests, reachable on localhost:5432.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bookmarks
          POSTGRES_PASSWORD: bookmarks
          POSTGRES_DB: bookmarks_test
        ports:
          - 5432:5432
        # Waits until the database accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U bookmarks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The tests read DATABASE_URL; the name ends in _test, as the test guard requires.
    env:
      DATABASE_URL: postgresql://bookmarks:bookmarks@localhost:5432/bookmarks_test
    steps:
      # Fetches the repository's code.
      - uses: actions/checkout@v4
      # Installs the Node version pinned in .node-version, and caches npm downloads
      # between runs using the lock file as the key.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Installs exactly what the lock file lists; postinstall generates the Prisma client.
      - run: npm ci
      # tsc --noEmit: Node never checks types, so this step does.
      - run: npm run typecheck
      # Vitest, once, without watching. Its global setup applies the migrations first.
      - run: npm test
